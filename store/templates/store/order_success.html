{% extends 'store/base.html' %}
{% block title %}Order Confirmed — LUXE Store{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center py-5" style="min-height: 70vh;">
  <div class="container" style="max-width: 480px;">
    
    <div class="card shadow-lg border-0 bg-white text-center">
      <div class="card-body p-5">
        <div class="display-5 mb-4" style="letter-spacing: 8px;">🎉 🛍️ ✨</div>
        
        <div class="bg-success-subtle rounded-circle d-flex align-items-center justify-content-center mx-auto mb-4" style="width: 80px; height: 80px;">
          <i class="fa fa-check text-success fs-1"></i>
        </div>
        
        <h1 class="fw-bold mb-3 fs-3">Order Confirmed!</h1>
        <p class="text-secondary mb-5 lh-lg">Your payment was successful and your order is being prepared. You'll receive updates soon.</p>
        
        <div class="d-flex flex-column gap-3">
          <a href="{% url 'order_history' %}" class="btn btn-dark py-3 fw-bold">
            <i class="fa fa-box me-2"></i> View My Orders
          </a>
          <a href="/" class="btn btn-outline-secondary py-3 fw-bold">
            <i class="fa fa-home me-2"></i> Continue Shopping
          </a>
        </div>
      </div>
    </div>
    
  </div>
</div>
{% endblock %}
