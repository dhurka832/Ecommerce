{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>E-Commerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="/">🛒 MyShop</a>

    <form class="d-flex mx-auto w-50" method="GET" action="/">
        <input class="form-control me-2" type="search" name="q" placeholder="Search products...">
        <button class="btn btn-warning">Search</button>
    </form>

    <div>
        <a href="/wishlist" class="btn btn-outline-light">❤️</a>
        <a href="/cart" class="btn btn-outline-light">🛒</a>

        {% if user.is_authenticated %}
            <a href="/orders" class="btn btn-outline-info">Orders</a>
            <a href="/logout" class="btn btn-danger">Logout</a>
        {% else %}
            <a href="/register" class="btn btn-light">Register</a>
            <a href="/login" class="btn btn-light">Login</a>
        {% endif %}
    </div>
</nav>

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

</body>
</html>
