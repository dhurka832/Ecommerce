{% extends 'base.html' %}

{% block content %}
<h2 class="mb-4">🛒 Shopping Cart</h2>

{% for item in items %}
<div class="card mb-3 p-3 shadow-sm">
    <div class="d-flex justify-content-between align-items-center">

        <div>
            <h5>{{ item.product.name }}</h5>
            <p>₹{{ item.product.price }} x {{ item.quantity }}</p>
        </div>

        <div>
            <a href="/increase/{{ item.id }}" class="btn btn-success btn-sm">+</a>
            <a href="/decrease/{{ item.id }}" class="btn btn-warning btn-sm">-</a>
            <a href="/remove/{{ item.id }}" class="btn btn-danger btn-sm">Remove</a>
        </div>

    </div>
</div>
{% endfor %}

<h4 class="mt-3">Total: ₹{{ total }}</h4>

<a href="/stripe-payment/" class="btn btn-dark">
    Pay with Card (Stripe)
</a>
{% endblock %}
