{% extends 'base.html' %}

{% block content %}
<div class="bg-warning text-dark p-5 rounded mb-4 text-center">
    <h1>Big Sale 🔥</h1>
    <p>Up to 50% OFF on all products</p>
</div>

<div class="d-flex overflow-auto mb-3">
    {% for cat in categories %}
        <a href="/?category={{ cat.name }}" 
           class="btn btn-light border me-2">
            {{ cat.name }}
        </a>
    {% endfor %}
</div>

<h2>Products</h2>

<div class="row">
    {% for product in products %}
    <div class="col-md-3">
        <div class="card shadow-sm mb-4 border-0">

            <img src="{{ product.image.url }}" class="card-img-top p-3" style="height:200px; object-fit:contain;">

            <div class="card-body">
                <h6 class="fw-bold">{{ product.name }}</h6>

                <p class="text-success fw-bold">₹{{ product.price }}</p>

                <div class="d-flex justify-content-between">
                    <a href="/add/{{ product.id }}/" class="btn btn-warning btn-sm">Add</a>
                    <a href="/wishlist/add/{{ product.id }}/" class="btn btn-outline-danger btn-sm">❤️</a>
                </div>

            </div>
        </div>
    </div>
    {% endfor %}
</div>

{% endblock %}
